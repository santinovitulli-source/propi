<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de inmobiliaria | Propi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="panel-header">
    <a href="index.html" class="logo">Prop<span>i</span></a>
    <div>
      <span class="panel-user" id="panel-user"></span>
      &nbsp;&nbsp;
      <button type="button" class="option-btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="panel-content">
    <div class="panel-toolbar">
      <h1>Mis propiedades</h1>
      <button type="button" class="btn btn-primary" id="new-property-btn">+ Nueva propiedad</button>
    </div>

    <p class="panel-empty" id="panel-empty" hidden>Todavía no cargaste ninguna propiedad. Empezá con "+ Nueva propiedad".</p>
    <div class="results-grid" id="properties-grid"></div>

    <div class="property-form-overlay" id="property-form-overlay" hidden>
      <div class="property-form-card">
        <h2 id="form-title">Nueva propiedad</h2>
        <p class="auth-error" id="form-error" hidden></p>

        <form id="property-form">
          <div class="form-row">
            <div class="form-group">
              <label for="f-operacion">Operación</label>
              <select id="f-operacion" required>
                <option value="">Elegí una opción</option>
              </select>
            </div>
            <div class="form-group">
              <label for="f-tipo">Tipo de propiedad</label>
              <select id="f-tipo" required>
                <option value="">Elegí una opción</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="f-zona">Zona</label>
              <select id="f-zona" required>
                <option value="">Elegí una opción</option>
              </select>
            </div>
            <div class="form-group">
              <label for="f-ambientes">Ambientes</label>
              <select id="f-ambientes" required>
                <option value="">Elegí una opción</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="f-precio">Precio</label>
              <input type="number" id="f-precio" min="0" placeholder="Ej: 150000" required>
            </div>
            <div class="form-group">
              <label for="f-whatsapp">WhatsApp de contacto</label>
              <input type="tel" id="f-whatsapp" placeholder="3411234567" required>
            </div>
          </div>

          <div class="form-group">
            <label for="f-descripcion">Descripción</label>
            <textarea id="f-descripcion" rows="4" placeholder="Contales a los interesados sobre la propiedad..."></textarea>
          </div>

          <div class="form-group">
            <label>Condiciones especiales</label>
            <div class="checkbox-group" id="f-condiciones"></div>
          </div>

          <div class="form-group">
            <label for="f-fotos">Fotos (hasta 20)</label>
            <input type="file" id="f-fotos" accept="image/*" multiple>
            <div class="photo-previews" id="photo-previews"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="option-btn" id="form-cancel-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="form-submit-btn">Guardar propiedad</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="js/panel.js"></script>
</body>
</html>
