<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Propi Inmobiliarias</title>
  <meta name="description" content="Registrá tu inmobiliaria en Propi para publicar propiedades en Rosario y la región.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body class="auth-page">

  <div class="auth-topbar">
    <a href="index.html" class="logo">Prop<span>i</span></a>
  </div>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Registrá tu inmobiliaria</h1>
      <p class="auth-subtitle">Publicá tus propiedades para toda Rosario y la región</p>

      <p class="auth-error" id="auth-error" hidden></p>

      <form id="registro-form">
        <div class="form-group">
          <label for="nombre">Nombre de la inmobiliaria</label>
          <input type="text" id="nombre" placeholder="Ej: Inmobiliaria Rosario Centro" autocomplete="organization" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tuinmobiliaria@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Al menos 6 caracteres" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="password-confirm">Repetir contraseña</label>
          <input type="password" id="password-confirm" placeholder="Repetí la contraseña" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="auth-submit" id="submit-btn">Crear cuenta</button>
      </form>

      <p class="auth-switch">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    </div>
  </main>

  <script type="module">
    import { createUserWithEmailAndPassword, updateProfile, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js';
    import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js';
    import { auth, db } from './js/firebase-config.js';
    import { translateAuthError } from './js/auth-errors.js';

    const form = document.getElementById('registro-form');
    const errorEl = document.getElementById('auth-error');
    const submitBtn = document.getElementById('submit-btn');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;

      if (password !== passwordConfirm) {
        showError('Las contraseñas no coinciden.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta...';

      try {
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(credential.user, { displayName: nombre });
        await setDoc(doc(db, 'inmobiliarias', credential.user.uid), {
          nombre,
          email,
          creadoEn: serverTimestamp(),
        });
        await sendEmailVerification(credential.user);
        window.location.href = 'verificar-email.html';
      } catch (err) {
        showError(translateAuthError(err));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
