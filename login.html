<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Propi Inmobiliarias</title>
  <meta name="description" content="Ingresá al panel de inmobiliarias de Propi para gestionar tus propiedades en Rosario y la región.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-topbar">
    <a href="index.html" class="logo">Prop<span>i</span></a>
  </div>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Ingresá a tu cuenta</h1>
      <p class="auth-subtitle">Panel para inmobiliarias de Rosario y la región</p>

      <p class="auth-error" id="auth-error" hidden></p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tuinmobiliaria@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-submit" id="submit-btn">Ingresar</button>
      </form>

      <p class="auth-switch">¿No tenés cuenta? <a href="registro.html">Registrá tu inmobiliaria</a></p>
    </div>
  </main>

  <script type="module">
    import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js';
    import { auth } from './js/firebase-config.js';
    import { translateAuthError } from './js/auth-errors.js';

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('auth-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'panel.html';
      } catch (err) {
        errorEl.textContent = translateAuthError(err);
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
